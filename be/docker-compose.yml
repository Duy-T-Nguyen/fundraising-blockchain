services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fundraising-backend
    ports:
      - "1609:1609"
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - AI_SIDECAR_URL=http://ai-sidecar:8000
    depends_on:
      - redis
      - ai-sidecar
    networks:
      - fundraising-network
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 8.8.4.4
    logging:
      driver: "json-file"
      options:
        max-size: "10mb"
        max-file: "3"

  ai-sidecar:
    build:
      context: ./ai-sidecar
      dockerfile: Dockerfile
    container_name: fundraising-ai-sidecar
    ports:
      - "8000:8000"
    networks:
      - fundraising-network
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: fundraising-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - backend
    networks:
      - fundraising-network
    restart: unless-stopped

  redis:
    image: redis:alpine
    container_name: fundraising-redis
    ports:
      - "6379:6379"
    networks:
      - fundraising-network
    restart: unless-stopped

volumes:
  mongodb_data:

networks:
  fundraising-network:
    # external: true
    driver: bridge
