services:
  mongodb:
    image: mongo:latest
    container_name: fundraising-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - fundraising-network
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fundraising-backend
    expose:
      - "1609"
    env_file:
      - .env
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/fundchain
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - mongodb
      - redis
    networks:
      - fundraising-network
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 8.8.4.4
    logging:
      driver: "json-file"
      options:
        max-size: "10mb"
        max-file: "3"

  nginx:
    image: nginx:alpine
    container_name: fundraising-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - backend
    networks:
      - fundraising-network
    restart: unless-stopped

  redis:
    image: redis:alpine
    container_name: fundraising-redis
    ports:
      - "6379:6379"
    networks:
      - fundraising-network
    restart: unless-stopped

volumes:
  mongodb_data:

networks:
  fundraising-network:
    external: true
