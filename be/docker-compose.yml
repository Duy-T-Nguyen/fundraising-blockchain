services:
  mongodb:
    image: mongo:latest
    container_name: fundraising-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fundraising-backend
    ports:
      - "1609:1609"
    env_file:
      - .env
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/fundchain
    depends_on:
      - mongodb
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10mb"
        max-file: "3"

volumes:
  mongodb_data:
